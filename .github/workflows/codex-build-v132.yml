name: Izgradi APK v1.3.2
on:
  push:
    branches: [CODEX-US-SUME]
permissions:
  contents: write
jobs:
  apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Lokalni JavaScript testovi
        run: for f in tests/js/*.test.js; do node "$f" || exit 1; done
      - name: Assets i WebView debug APK
        run: |
          bash android/copy-assets.sh
          gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: US-SUME-v1.3.2-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Ukloni jednokratni build
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/codex-build-v132.yml
          git commit -m "ci: ukloni jednokratni APK build v1.3.2"
          git push origin HEAD:CODEX-US-SUME
