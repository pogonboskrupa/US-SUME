name: Primijeni v1.3.3 i izgradi APK
on:
  push:
    branches: [CODEX-US-SUME]
permissions:
  contents: write
jobs:
  apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CODEX-US-SUME
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Primijeni provjerene izmjene v1.3.3
        run: |
          printf '%s' '' | base64 -d > /tmp/v133.patch
          git apply --check /tmp/v133.patch
          git apply /tmp/v133.patch
      - name: JavaScript testovi
        run: for f in tests/js/*.test.js; do node "$f" || exit 1; done
      - name: Assets i WebView debug APK
        run: |
          bash android/copy-assets.sh
          gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: US-SUME-v1.3.3-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Objavi v1.3.3 i ukloni jednokratni workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle docs/CODEX_CONTEXT.md index.html sw.js tests/js/admin-debug.test.js
          git rm -f .github/workflows/codex-build-v133.yml
          git commit -m "feat: dodaj debug sjece i vjetroizvala"
          git push origin HEAD:CODEX-US-SUME
