name: APK v1.2.4 preuzimanje
on:
  push:
    branches:
      - fix/codex-us-sume-workflow-169a5b7
permissions:
  contents: write
jobs:
  apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-us-sume-workflow-169a5b7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: JavaScript testovi
        run: for f in tests/js/*.test.js; do node "$f" || exit 1; done
      - name: Build APK
        run: |
          bash android/copy-assets.sh
          gradle -p android --no-daemon assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk US-SUME-v1.2.4-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: US-SUME-v1.2.4-debug
          path: US-SUME-v1.2.4-debug.apk
          if-no-files-found: error
      - name: Ukloni jednokratni workflow
        run: |
          rm .github/workflows/codex-build-apk-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/codex-build-apk-once.yml
          git commit -m "chore: ukloni jednokratni APK build"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
