name: Apply fire window fix
on:
  workflow_dispatch:
  push:
    branches: [fix/codex-us-sume-workflow-169a5b7]
    paths: [.github/workflows/codex-apply-fire-window.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-us-sume-workflow-169a5b7
      - name: Apply patch and test
        run: |
          echo '' | base64 -d | gzip -d > /tmp/fire.patch
          git apply --check /tmp/fire.patch
          git apply /tmp/fire.patch
          for f in tests/js/*.test.js; do node "$f" >/dev/null; done
          git rm .github/workflows/codex-apply-fire-window.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js android/app/build.gradle tests/js/pozari.test.js
          git commit -m "fix: zadrzi nedavne ugasene pozare u pregledu"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
