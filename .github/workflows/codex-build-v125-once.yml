name: Build debug APK v1.2.5
on:
  push:
    branches: [fix/codex-us-sume-workflow-169a5b7]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-us-sume-workflow-169a5b7
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Copy web assets
        run: ./android/copy-assets.sh
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: US-SUME-v1.2.5-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Remove one-time workflow
        if: always()
        run: |
          rm .github/workflows/codex-build-v125-once.yml
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add .github/workflows/codex-build-v125-once.yml
          git commit -m "chore: ukloni jednokratni APK build"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
