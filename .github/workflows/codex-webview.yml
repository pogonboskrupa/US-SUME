name: CODEX WebView provjera i APK
on:
  workflow_dispatch:
  push:
    branches:
      - CODEX-US-SUME
      - CODEX-US-SUME-2026-10-01
      # Claude Code radna grana — isti build/testovi/release za Meni → Ažuriraj aplikaciju.
      - claude/elegant-mayer-4lxj53
      # Produkcijska grana od v3.2.4 — jedina koja objavljuje Release.
      - claude/inline-js-split
concurrency:
  group: codex-webview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  apk:
    if: github.ref == 'refs/heads/CODEX-US-SUME' || github.ref == 'refs/heads/CODEX-US-SUME-2026-10-01' || github.ref == 'refs/heads/claude/elegant-mayer-4lxj53' || github.ref == 'refs/heads/claude/inline-js-split'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: codex_test
          POSTGRES_DB: codex_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Testovi idu PRIJE Android SDK setupa: oni ne trebaju ni SDK ni Gradle, a
      # kad setup-android padne (kao 2026-09-14 na uklonjenom 'tools' paketu)
      # ovaj korak se preskakao pa se iz CI-ja nije vidjelo ni da li kod valja.
      - name: Lokalni JavaScript testovi
        run: |
          for f in tests/js/*.test.js; do node "$f" || exit 1; done
          node tests/simulation/doznaka-sixdays.js
      - name: PostgreSQL probni pristup i RLS (samo testna baza)
        env:
          PGPASSWORD: codex_test
        run: |
          psql -h localhost -U postgres -d codex_fixture -f tests/sql/probni-pristup-238.sql
          psql -h localhost -U postgres -d codex_fixture -f tests/sql/doz-atomic-delete-272.sql
          psql -h localhost -U postgres -d codex_fixture -f tests/sql/user-activity-273.sql
          psql -h localhost -U postgres -d codex_fixture -f tests/sql/verzija-aplikacije.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pregled Menija, projekata, Dnevnog moda i štampe
        run: |
          python -m pip install playwright==1.55.0
          # apt mirror (azure.archive.ubuntu.com) zna ne odgovarati: run 317 i 403 pali na exit 100, a run 404
          # je visio preko 38 min. Zato svaki apt korak ima tvrd rok, a ako ne uspije preglednik se
          # instalira bez sistemskih paketa (runner ih većinom već ima).
          ok=0
          for i in 1 2; do
            timeout 60 sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15 || true
            if timeout 240 python -m playwright install --with-deps chromium; then ok=1; break; fi
            echo "Pokušaj $i instalacije preglednika nije uspio"; sleep 10
          done
          if [ "$ok" != 1 ]; then timeout 300 python -m playwright install chromium; fi
          bash tests/browser/run-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Teren-5400-${{ github.sha }}
          path: outputs/field-simulation/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-pregled-${{ github.sha }}
          path: |
            outputs/ui-preview/
            outputs/274/
            outputs/275/
            outputs/276/
            outputs/277/
            outputs/278/
            outputs/279/
            outputs/280/
            outputs/281/
            outputs/282/
            outputs/286/
            outputs/287/
          if-no-files-found: ignore
      - uses: android-actions/setup-android@v3
        with:
          # Podrazumijevano instalira 'tools platform-tools', a legacy 'tools'
          # paket je uklonjen iz Google repozitorija — sdkmanager tad pada sa
          # "Failed to find package 'tools'" i cijeli build stane prije ijednog
          # koraka koji je stvarno naš.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          # Podrazumijevano setup-gradle keš SPREMA samo na default grani repoa;
          # CODEX-US-SUME to nije, pa je keš bio read-only i svaki build je
          # ponovo skidao sve Gradle/AGP zavisnosti sa Maven Centrala — što je
          # 2026-09-24 palo na "429 Too Many Requests" prije ijednog kompajliranja.
          cache-read-only: false
      - name: Assets i WebView debug APK
        run: |
          bash android/copy-assets.sh
          # Više pokušaja sa dužim razmakom za dohvat zavisnosti (podrazumijevano
          # 3 pokušaja / 1 s) — za prvi build bez keša kad Maven vrati 429.
          gradle -p android --no-daemon \
            -Dorg.gradle.internal.repository.max.retries=6 \
            -Dorg.gradle.internal.repository.initial.backoff=3000 \
            assembleDebug
      - name: Provjeri sadržaj APK-a (index.html, GRANICE.kml) i ispiši veličinu
        # copy-assets.sh kopira GRANICE.kml sa "|| true" (ne ruši build ako fajl
        # nedostaje) — to znači da APK može biti "uspješno" izgrađen a da mu
        # ipak fali ključni sadržaj (mala, tiho nepotpuna karta na terenu).
        # Provjera raspakuje STVARNI APK i gleda šta je unutra, ne pretpostavlja
        # na osnovu toga da je gradle vratio exit 0.
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "GRESKA: APK fajl nije pronađen u outputs/apk/debug/"
            exit 1
          fi
          echo "APK fajl: $APK_PATH"
          echo "Veličina APK fajla (kompresovan): $(du -h "$APK_PATH" | cut -f1)"

          rm -rf /tmp/apk-check
          mkdir -p /tmp/apk-check
          unzip -q "$APK_PATH" -d /tmp/apk-check
          echo "Veličina raspakovanog APK-a: $(du -sh /tmp/apk-check | cut -f1)"

          MISSING=0
          for f in assets/index.html assets/GRANICE.kml; do
            if [ ! -s "/tmp/apk-check/$f" ]; then
              echo "NEDOSTAJE ili je prazan: $f"
              MISSING=1
            else
              echo "OK: $f ($(du -h "/tmp/apk-check/$f" | cut -f1))"
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "GRESKA: APK ne sadrži očekivane asset fajlove — build se prekida,"
            echo "artefakt se NE objavljuje (bolje bez APK-a nego sa tiho nepotpunim)."
            exit 1
          fi
      - name: Provjeri SHA-256 svih web assets u APK-u
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          python3 android/assets.py verify --apk "$APK_PATH"
      - name: Provjeri manji APK bez ugrađenog OCR modela
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          apk=next(Path('android/app/build/outputs/apk/debug').glob('*.apk'))
          with ZipFile(apk) as z:
              assert not any('libmlkit_google_ocr_pipeline.so' in n or 'mlkit-google-ocr-models/' in n for n in z.namelist()), 'Ugrađeni OCR je ostao u APK-u'
          size=apk.stat().st_size
          print(f'APK: {size:,} B = {size/1000000:.2f} MB; prethodni 65.14 MB')
          assert size < 30_000_000, 'APK nije smanjen ispod 30 MB'
          PYCODE
      - name: Pripremi KVM za provjeru OCR mrežnog uslova
        run: sudo chmod 666 /dev/kvm
      - name: Android Explorer WebView i OCR bez interneta
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash tests/android/explorer-offline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-provjera-${{ github.sha }}
          path: |
            outputs/android-test/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: US-SUME-CODEX-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # Actions artifact (gore) traži GitHub login za preuzimanje i ističe za
      # 90 dana — korisnik je morao ručno naći run, ući u nalog, skinuti .zip,
      # raspakovati, instalirati. GitHub Release asset je JAVNO dostupan preko
      # stabilnog URL-a bez prijave — to omogućava "Ažuriraj aplikaciju" u Meniju
      # (AndroidUpdate.checkAndInstall, MainActivity.java) da automatski nađe
      # najnoviju verziju preko /releases?per_page=1 i preuzme APK direktno.
      - name: Izvuci versionName iz build.gradle
        id: verzija
        run: |
          V=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          if [ -z "$V" ]; then echo "GRESKA: versionName nije pronađen"; exit 1; fi
          echo "verzija=$V" >> "$GITHUB_OUTPUT"
      - name: Objavi/ažuriraj GitHub Release sa APK-om (za auto-update u app-u)
        # SAMO produkcijska grana. Release je ono što UpdateBridge nudi SVIM
        # telefonima kroz Meni → Ažuriraj aplikaciju (/releases?per_page=1). Od
        # v3.2.4 produkcija je claude/inline-js-split (odluka korisnika); ostale
        # grane iz OVOG fajla više ne objavljuju (jedan izvor, inače "zadnji
        # objavljen" pobjeđuje na svim telefonima).
        if: github.ref == 'refs/heads/claude/inline-js-split'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.verzija.outputs.verzija }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.verzija.outputs.verzija }} (debug)
          # "latest" (ne prerelease) da stalni link .../releases/latest/download/app-debug.apk
          # uvijek vodi na zadnji APK — /releases/latest preskače prerelease objave.
          prerelease: false
          make_latest: "true"
          body: |
            APK za ažuriranje kroz Meni → Ažuriraj aplikaciju.
            Stalni link na najnoviju verziju: https://github.com/pogonboskrupa/US-SUME/releases/latest/download/app-debug.apk
            Izvor: ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/*.apk
          # Ako glob gore ne pogodi nijedan fajl (npr. build output struktura
          # se promijeni), akcija MORA pasti — bolje nego tiho objaviti release
          # bez APK-a, što bi auto-update u app-u pronašao ali ne mogao skinuti.
          fail_on_unmatched_files: true
          # softprops/action-gh-release je idempotentan po tag_name-u — isti
          # versionName u više commit-ova (npr. popravka bez bump-a verzije)
          # samo AŽURIRA postojeći release/asset, ne pada na "tag already exists".

      - name: Analiza brzine poslije objave APK-a
        run: python tests/browser/performance-redmi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Analiza-brzine-${{ github.sha }}
          path: outputs/performance/
          if-no-files-found: ignore
