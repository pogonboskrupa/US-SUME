name: CODEX WebView provjera i APK
on:
  workflow_dispatch:
  push:
    branches:
      - CODEX-US-SUME
permissions:
  contents: read
jobs:
  apk:
    if: github.ref == 'refs/heads/CODEX-US-SUME'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Lokalni JavaScript testovi
        run: for f in tests/js/*.test.js; do node "$f" || exit 1; done
      - name: Assets i WebView debug APK
        run: |
          bash android/copy-assets.sh
          gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: US-SUME-CODEX-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
