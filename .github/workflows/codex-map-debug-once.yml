name: Apply map startup debug
on:
  push:
    branches: [fix/codex-us-sume-workflow-169a5b7]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-us-sume-workflow-169a5b7
          fetch-depth: 0
      - name: Apply tested patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/map-debug.patch
          git apply --check /tmp/map-debug.patch
          git apply /tmp/map-debug.patch
      - name: Test
        run: |
          set -e
          for f in tests/js/*.test.js; do node "$f" >/dev/null; done
      - name: Commit and remove helper
        run: |
          rm .github/workflows/codex-map-debug-once.yml
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add index.html sw.js android/app/build.gradle tests/js/map-restore-indicator.test.js tests/js/startup-map-placeholder.test.js .github/workflows/codex-map-debug-once.yml
          git commit -m "feat: dodaj startup debug učitavanja karte"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
