name: Primijeni provjerenu popravku požara i startupa
on:
  push:
    branches:
      - fix/codex-us-sume-workflow-169a5b7
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-us-sume-workflow-169a5b7
      - name: Primijeni tačan testirani patch
        run: |
          printf '%s' '' | base64 -d > /tmp/codex-fix.patch
          git apply --check /tmp/codex-fix.patch
          git apply /tmp/codex-fix.patch
      - name: Pokreni JavaScript testove
        run: for f in tests/js/*.test.js; do node "$f" || exit 1; done
      - name: Sačuvaj izmjene i ukloni jednokratni workflow
        run: |
          rm .github/workflows/codex-apply-remaining-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js android/app/build.gradle tests/js/pozari.test.js tests/js/map-restore-indicator.test.js .github/workflows/codex-apply-remaining-fixes.yml
          git commit -m "fix: prikaži požare 30 dana i ubrzaj OPFS startup"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
