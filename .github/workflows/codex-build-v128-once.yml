name: Build debug APK v1.2.8
on:
  workflow_dispatch:
  push:
    branches: [fix/codex-us-sume-workflow-169a5b7]
    paths: [.github/workflows/codex-build-v128-once.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-us-sume-workflow-169a5b7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Build
        run: |
          chmod +x android/copy-assets.sh
          ./android/copy-assets.sh
          gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: US-SUME-v1.2.8-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/codex-build-v128-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: ukloni jednokratni APK build v1.2.8"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
