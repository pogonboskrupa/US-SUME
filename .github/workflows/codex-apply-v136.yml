name: Primijeni v1.3.6 optimizaciju
on:
  push:
    branches: [CODEX-US-SUME]
    paths: [.codex/index-v136.html.gz.b64]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CODEX-US-SUME
      - name: Vrati optimizovani index
        run: base64 -d .codex/index-v136.html.gz.b64 | gzip -d > index.html
      - name: Commit v1.3.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .codex/index-v136.html.gz.b64 .github/workflows/codex-apply-v136.yml
          git commit -m "perf: ubrzaj požare i dijagnosticiraj ponovni restore"
          git push origin HEAD:CODEX-US-SUME
