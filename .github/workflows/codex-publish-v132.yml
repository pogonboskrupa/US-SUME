name: Objavi CODEX v1.3.2
on:
  push:
    branches: [CODEX-US-SUME]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CODEX-US-SUME
          fetch-depth: 0
      - name: Primijeni provjerene izmjene
        run: |
          git fetch origin fix/codex-us-sume-workflow-169a5b7 CODEX-US-SUME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B codex-publish origin/fix/codex-us-sume-workflow-169a5b7
          git merge --no-edit "$GITHUB_SHA"
          git apply .codex/v1.3.2.patch
          rm -f .codex/v1.3.2.patch .github/workflows/codex-publish-v132.yml
          git add -A
          git commit -m "fix: prikaži razvoj požara direktno na karti"
          git push origin HEAD:CODEX-US-SUME
