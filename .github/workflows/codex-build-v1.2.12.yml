name: Build APK v1.2.12
on:
  push:
    branches: [fix/codex-us-sume-workflow-169a5b7]
    paths: [.github/workflows/codex-build-v1.2.12.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-us-sume-workflow-169a5b7
      - name: Apply v1.2.12 changes
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v1212.patch
          git apply --index /tmp/v1212.patch
      - name: Test
        run: for f in tests/js/*.test.js; do node "$f"; done
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: suzi procjenu opožarene površine"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Prepare assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json sw.js icon-192.png icon-512.png apple-touch-icon.png android/app/src/main/assets/
          cp -r geo doznaka PUTEVI static .well-known android/app/src/main/assets/
          cp forwarder.svg GRANICE.kml android/app/src/main/assets/
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: US-SUME-v1.2.12-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Remove workflow
        if: always()
        run: |
          git pull --rebase origin fix/codex-us-sume-workflow-169a5b7
          git rm .github/workflows/codex-build-v1.2.12.yml
          git commit -m "ci: ukloni jednokratni APK build v1.2.12"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
