name: Deploy GitHub Pages

on:
  push:
    # "!claude/inline-js-split": test grana NE smije zamijeniti živi webapp —
    # Pages je jedan za sve, a sw.js bi test kod tiho podvalio svim korisnicima.
    # Negacija mora stajati POSLIJE "claude/**" (GitHub čita obrasce redom).
    branches: [main, "claude/**", "!claude/inline-js-split"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
