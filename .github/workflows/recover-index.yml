name: Oporavak izvornog index.html

on:
  push:
    branches: [CODEX-US-SUME]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Vrati puni izvorni fajl
        run: |
          if ! compgen -G '.codex-recovery/index.html.b64.*' > /dev/null; then exit 0; fi
          cat .codex-recovery/index.html.b64.* | base64 --decode > index.html
          node -e "const s=require('fs').readFileSync('index.html','utf8'); if (!s.includes(\"const APP_VER = 'v1.2.3'\") || !s.includes('function _poziObnoviPrikaz()')) process.exit(1)"
      - name: Sačuvaj oporavak i ukloni privremene dijelove
        run: |
          if ! compgen -G '.codex-recovery/index.html.b64.*' > /dev/null; then exit 0; fi
          rm -rf .codex-recovery
          git config user.name 'Pogon Bos.Krupa'
          git config user.email 'pogonboskrupa@gmail.com'
          git add index.html .codex-recovery
          git commit -m 'fix: objavi zapamćeni prikaz požara'
          git push origin HEAD:CODEX-US-SUME
