name: Apply admin debug center

on:
  push:
    branches: [fix/codex-us-sume-workflow-169a5b7]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-us-sume-workflow-169a5b7
      - name: Apply verified patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/codex-admin-debug.patch
          git apply --check /tmp/codex-admin-debug.patch
          git apply /tmp/codex-admin-debug.patch
      - name: Run JavaScript tests
        shell: bash
        run: |
          for f in tests/js/*.test.js; do node "$f" >/dev/null; done
      - name: Commit source and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/codex-admin-debug-once.yml
          git add index.html sw.js android/app/build.gradle tests/js/admin-debug.test.js
          git config user.name "Pogon Bos.Krupa"
          git config user.email "pogonboskrupa@gmail.com"
          git commit -m "feat: dodaj admin debug centar i dijagnostiku požara"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
