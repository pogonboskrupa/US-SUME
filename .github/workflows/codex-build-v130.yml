name: Codex build Požari v1.3.0
on:
  push:
    branches:
      - fix/codex-us-sume-workflow-169a5b7
    paths:
      - .github/workflows/codex-build-v130.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-us-sume-workflow-169a5b7
          fetch-depth: 0
      - name: Apply verified Codex patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d | git apply --index
      - name: Run JavaScript tests
        shell: bash
        run: |
          for f in tests/js/*.test.js; do node "$f"; done
      - name: Publish source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: uvedi operativni modul požara v1.3.0"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"
      - name: Build debug APK
        shell: bash
        run: |
          bash android/copy-assets.sh
          gradle --no-daemon -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: US-SUME-v1.3.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          git pull --rebase origin fix/codex-us-sume-workflow-169a5b7
          git rm .github/workflows/codex-build-v130.yml
          git commit -m "ci: ukloni jednokratni APK build v1.3.0"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
