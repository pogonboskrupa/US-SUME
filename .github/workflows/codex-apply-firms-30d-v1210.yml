name: Apply FIRMS 30-day coverage
on:
  push:
    branches: [fix/codex-us-sume-workflow-169a5b7]
    paths: [.github/workflows/codex-apply-firms-30d-v1210.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: fix/codex-us-sume-workflow-169a5b7 }
      - run: |
          echo '' | base64 -d | gzip -d > /tmp/v1210.patch
          git apply --check /tmp/v1210.patch
          git apply /tmp/v1210.patch
          for f in tests/js/*.test.js; do node "$f" >/dev/null; done
          git rm .github/workflows/codex-apply-firms-30d-v1210.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js android/app/build.gradle tests/js/pozari.test.js tests/js/firms-api-sources.test.js
          git commit -m "fix: popuni pozare izmedju 7 i 30 dana"
          git push origin HEAD:fix/codex-us-sume-workflow-169a5b7
