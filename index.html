  }, err => { console.warn('Doznaka GPS', err); _dozUpdGpsStats(null); },
  { enableHighAccuracy:true, maximumAge:3000, timeout:15000 });
}

// Obrada jedne GPS tačke za pojas doznake — dijeljeno između uživo
// watchPosition callbacka (bez tsMs, koristi trenutno vrijeme kao ranije) i
// _drainNativeGpsBuffer replay-a (sa tsMs = stvarno historijsko vrijeme
// fiksa, da recorded_at u bazi ostane tačan umjesto "sad" za tačku snimljenu
// prije nekoliko minuta dok je app bio zatvoren).
async function _dozProcessGpsPoint(lat, lng, alt, acc, speed, tsMs, bypassPauzu) {
  if (!_dozGpsOn || !_dozGpsProjId || !_dozGpsUserId) return;
  if (acc > 20) { _dozUpdGpsStats(acc); return; }
  if (_dozGpsPaused && !bypassPauzu) { _dozUpdGpsStats(acc); return; }
  const prev = _dozGpsPts[_dozGpsPts.length - 1];
  const d = prev ? dst(prev[0], prev[1], lat, lng) : 0;
  if (prev) {
    if (d < _DOZ_GPS_MIN_DIST) { _dozUpdGpsStats(acc); return; }
  }
  const isoTs = new Date(tsMs || Date.now()).toISOString();
  // Prvo trajni upis: neuspjela tačka ne smije pomjeriti filter udaljenosti.
  const _dozPt = {
    project_id: _dozGpsProjId, user_id: _dozGpsUserId,
    latitude: lat, longitude: lng,
    altitude: alt || null, accuracy: acc, speed: speed || null,
    recorded_at: isoTs
  };
  if (!_dozBufferTrackPoint(_dozPt)) throw new Error('GPS tačka nije trajno sačuvana');
  _dozGpsLen += d;
  const spdMs = (speed != null && speed >= 0) ? speed : 0;
  if (spdMs > _dozGpsMaxSpd) _dozGpsMaxSpd = spdMs;
  _dozGpsSpdSum += spdMs; _dozGpsSpdCnt++;
  if (alt != null) _dozGpsElevData.push(alt);
  _dozGpsFullPts.push({ lat, lon: lng, ele: alt || 0, time: isoTs, spd: spdMs });
  if (prev) {
    const kmh = spdMs * 3.6;
    const col = kmh < 1 ? '#60a5fa' : kmh < 3 ? '#4ade80' : kmh < 6 ? '#fbbf24' : '#ef4444';
    L.polyline([[prev[0], prev[1]], [lat, lng]], { color: col, weight: 3, opacity: 0.9 }).addTo(_dozGpsTrackLayer);
  }
  _dozGpsPts.push([lat, lng]);
  _dozSaveLivePts();
  _dozGpsBuffered++;
  // Zove se na SVAKU GPS tačku — red sam odlučuje o vezi i poštuje pauzu
  // poslije mrežnog pada, pa slaba/mrtva veza nije gađana svakih par sekundi.
  _processOfflineQueue().catch(() => {});
  _dozUpdGpsStats(acc);
  _dozCheckBandCross(lat, lng);
  if (_dozGpsProjId === _dozSelId) _dozLiveRacunMozda();
}

// ─── Upozorenje kad projektant uđe u tuđi pojas ─────────────────
let _dozCrossWarnTs = 0;
let _dozCrossMarker = null;
let _dozCrossCount = 0;

function _dozCheckBandCross(lat, lng) {
  if (!_dozGpsOn || !_dozGpsUserId || !_dozCrossWarnEnabled) return;
  const now = Date.now();
  if (now - _dozCrossWarnTs < 15000) return;
  // Provjera najviše svakih 5 s — gradnja tragova je O(n²) (nearestPointOnLine
  // po tački), a ova funkcija se zove na SVAKU GPS tačku.
  if (now - (_dozCheckBandCross._t || 0) < 5000) return;
  _dozCheckBandCross._t = now;

  const userTracks = _dozBuildUserTracks();
  const otherTracks = userTracks.filter(t => t.uid !== _dozGpsUserId);
  if (!otherTracks.length) return;

  const myTracks = userTracks.filter(t => t.uid === _dozGpsUserId);
  const pt = turf.point([lng, lat]);

  let myDist = Infinity;
  myTracks.forEach(t => {
    const n = turf.nearestPointOnLine(t.line, pt);
    if (n.properties.dist < myDist) myDist = n.properties.dist;
  });

  let closestOther = null;
  let otherDist = Infinity;
  otherTracks.forEach(t => {
    const n = turf.nearestPointOnLine(t.line, pt);
    if (n.properties.dist < otherDist) {
      otherDist = n.properties.dist;
      closestOther = t;
    }
  });

  if (otherDist < myDist && otherDist < 0.025) {
    _dozCrossCount++;
    if (_dozCrossCount >= 3) {
      _dozCrossWarnTs = now;
      const mIdx = {};
      _dozMembers.forEach((m, i) => { mIdx[m.user_id] = i; });
      const name = _escHtml(_dozImeClana(closestOther.uid));
      const col = DOZ_ENG_COLORS[(mIdx[closestOther.uid] ?? 0) % DOZ_ENG_COLORS.length];
      showToast(`⚠ Prelazite u pojas: ${name}`);
      if (_dozCrossMarker) map.removeLayer(_dozCrossMarker);
      _dozCrossMarker = L.circleMarker([lat, lng], {
        radius: 10, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.4, weight: 2
      }).addTo(_dozGpsTrackLayer || map);
      _dozCrossMarker.bindTooltip(`⚠ Prelaz u pojas: ${name}`, { permanent: false, opacity: 0.9 });
      setTimeout(() => { if (_dozCrossMarker) { try { map.removeLayer(_dozCrossMarker); } catch(e) {} _dozCrossMarker = null; } }, 30000);
      _dozCrossCount = 0;
    }
  } else {
    _dozCrossCount = 0;
  }
}

// RPC zaključava jednu logičku GPS tačku na serveru. Kompatibilni fallback
// koristi postojeće kolone (id u staroj šemi može biti bigserial, ne UUID).
// Slanje doznaka GPS tačaka u SERIJAMA (v1.9.2). Ranije je svaka tačka bila
// svoj zahtjev (uz RPC, a bez njega DVA — provjera + upis), a poslije svake se
// CIJELI bafer parsirao i prepisivao. Dan doznake bez signala (hiljade tačaka)
// je tako na slaboj vezi značio sat vremena zahtjeva, a sve novo u redu (vlaka
// sačuvana u međuvremenu) čekalo je iza toga. Sad: jedna provjera postojećih u
// vremenskom prozoru serije + jedan upis onih kojih nema. Idempotentno isto kao
// RPC (tačka = vlasnik + odjel + vrijeme + koordinate), a ne traži migraciju.
const _DOZ_KOMAD = 100;
function _dozTackaKljuc(t, la, lo) { return Date.parse(t) + '|' + Number(la) + '|' + Number(lo); }
async function _dozPosaljiKomad(komad) {
  const ms = komad.map(p => Date.parse(p.recorded_at)).filter(Number.isFinite);
  if (!ms.length) return { ok: [], error: { code: '22023', message: 'Neispravno vrijeme GPS tačke' } };
  const ima = await sb.from('doz_track_points').select('recorded_at,latitude,longitude')
    .eq('user_id', komad[0].user_id).eq('project_id', komad[0].project_id)
    .gte('recorded_at', new Date(Math.min(...ms)).toISOString())
    .lte('recorded_at', new Date(Math.max(...ms)).toISOString())
    .limit(5000);
  if (ima.error) return { ok: [], error: ima.error };
  // PostgREST vraća najviše 1000 redova (max-rows). Širok prozor (npr. stara
  // zaglavljena tačka od prije par dana u istoj seriji) bi dao nepotpunu
  // provjeru → duplikate. Takva serija ide pojedinačno (vidi pozivaoca).
  if ((ima.data || []).length >= 1000) return { ok: [], error: { code: 'KOMAD_SIROK', message: 'preširok prozor serije' } };
  const postoji = new Set((ima.data || []).map(r => _dozTackaKljuc(r.recorded_at, r.latitude, r.longitude)));
  const nove = komad.filter(p => !postoji.has(_dozTackaKljuc(p.recorded_at, p.latitude, p.longitude)))
    .map(({ _qid, ...p }) => p);
  if (nove.length) {
    const { error } = await sb.from('doz_track_points').insert(nove);
    if (error) return { ok: [], error };
  }
  return { ok: komad.map(p => p._qid), error: null };
}
async function _dozPosaljiPojedinacno(komad) {
  const ok = [];
  for (const pt of komad) {
    const { _qid, ...payload } = pt;
    const { error } = await _sendDozTrackPoint(payload);
    if (error) {
      if (_isNetworkErr(error) || _isAuthErr(error) || _serverPrivremeno(error)) return { ok, error };
      continue;   // FK/RLS greška ostaje sačuvana, bez gubitka GPS tačke
    }
    ok.push(_qid);
  }
  return { ok, error: null };
}

async function _sendDozTrackPoint(payload) {
  const result = await sb.rpc('codex_save_gps_point', { p:payload });
  if (!result.error || result.error.code !== 'PGRST202') return result;
  const lookup = await sb.from('doz_track_points').select('user_id')
    .eq('user_id', payload.user_id).eq('project_id', payload.project_id)
    .eq('recorded_at', payload.recorded_at).eq('latitude', payload.latitude)
    .eq('longitude', payload.longitude).limit(1);
  if (lookup.error) return lookup;
  if (lookup.data?.length) return { error:null };
  return await sb.from('doz_track_points').insert(payload);
}

// Spremi GPS tačku u offline buffer (poziva se i pri mrežnoj i pri DB/RLS grešci).
// Sinhrono (bez await) → atomarno u single-thread JS, ne može se ispreplitati.
function _dozBufferTrackPoint(pt) {
  try {
    const buf = JSON.parse(localStorage.getItem(_DOZ_TRACK_BUF_KEY) || '[]');
    if (!pt._qid) pt._qid = _genUUID();
    buf.push(pt);
    localStorage.setItem(_DOZ_TRACK_BUF_KEY, JSON.stringify(buf));
    return true;
  } catch(e) { showToast('⚠ GPS tačka nije sačuvana — provjeri memoriju'); return false; }
}

// Spasi live trag lokalno — ako Android ubije WebView u backgroundu, ne gubimo liniju
const _DOZ_LIVE_KEY = 'tvlake_doz_live';
// Javi se JEDNOM po snimanju, ne na svaku GPS tačku — ova funkcija se zove na
// svaki fiks, pa bi toast po tački bio neupotrebljiv usred rada.
let _dozLiveUpisPao = false;
function _dozSaveLivePts() {
  if (!(_dozGpsOn && _dozGpsPts.length)) return true;
  const tekst = JSON.stringify({ projId:_dozGpsProjId, pts:_dozGpsPts, len:_dozGpsLen, ts:Date.now() });
  try {
    localStorage.setItem(_DOZ_LIVE_KEY, tekst);
    _dozLiveUpisPao = false;   // oporavilo se — sljedeći kvar se smije opet javiti
    return true;
  } catch(e) {
    // Ovo je CRASH-ZAŠTITA snimanja doznake (vidi komentar iznad ključa). Tiho
    // progutan neuspjeh znači da pri sljedećem ubistvu WebView-a — koje OEM
    // battery manager radi redovno — nestane cijeli snimljeni pojas, a da
    // korisnik nikad nije saznao da zaštite nema.
    if (_dozLiveUpisPao) return false;
    _dozLiveUpisPao = true;
    _localSetKriticno(_DOZ_LIVE_KEY, tekst, 'Zaštita snimanja doznake');
    return false;
  }
}

function dozStopGPS() {
  if (_dozGpsWatchId !== null) { navigator.geolocation.clearWatch(_dozGpsWatchId); _dozGpsWatchId = null; }
  const wasOn = _dozGpsOn;
  _dozGpsOn = false;
  _dozGpsProjId = null; _dozGpsUserId = null;

  _pauziZavrsi(_dozPauseWin);    // stop usred pauze bi inače ostavio vječno otvoren interval
  _bgRecStopIfIdle();  // otpusti pozadinski servis/lock ako ništa drugo ne snima

}

  const label  = document.getElementById('doz-save-label').value.trim() || null;
  const note   = document.getElementById('doz-save-note').value.trim()  || null;
  // Računaj iz spremljene geometrije (_dozPendingSavePolygon), ne iz mutable _dozDrawPts
  const areaHa = _dozCalcGeomAreaHa(_dozPendingSavePolygon);
  const markingPayload = {
    id: _genUUID(),
    project_id: _dozSelId, created_by: sbUser.id,
    marking_type: _dozDrawType, label, note,
    boundary_geojson: _dozPendingSavePolygon,
    area_ha: areaHa, is_visible: true
  };
  try {
    // Bez veze se ne čeka mrežni poziv (na mrtvoj vezi do 15 s sa otvorenim
    // modalom) — zona ide lokalno i u red odmah.
    if (!_serverSlanjeDozvoljeno() || !_mrezaProbaj()) throw new Error('offline');
    const { error } = await _dozUpisiZonu(markingPayload);
    if (error) throw error;
    document.getElementById('doz-save-modal').style.display = 'none';
    _dozPendingSavePolygon = null;
    dozCancelDraw();
    showToast('✅ Zona sačuvana!');
    await dozLoadLayers(_dozSelId);
    dozRenderDetail();
  } catch(e) {
    // D4-B: pamti privremeni ID i uz payload u redu čekanja da kasnije brisanje
    // (prije nego se ovaj insert sinhronizuje) može ispravno pronaći/otkazati red.
    const localId = 'local_' + Date.now();
    _OL.enqueue({ type: 'insert_doz_marking', payload: markingPayload, _localId: localId });
    // Dodaj u lokalni keš da se prikaže i offline
    _dozMarkings.unshift({ ...markingPayload, id: localId });
    _dozCacheLayers(_dozSelId);
    dozRenderMapLayers();
    dozRenderDetail();
    document.getElementById('doz-save-modal').style.display = 'none';
    _dozPendingSavePolygon = null;
    dozCancelDraw();
    showToast('💾 Zona sačuvana — kolegama ide kad je pošalješ (Meni → Server)');
  }
  } catch(e) {
    // v1.6.0: vanjski try je imao SAMO `finally` (reset zastavice), bez catch-a.
    // Unutrašnji try/catch hvata mrežni neuspjeh i sprema u red čekanja, ali sve
    // što pukne PRIJE njega — npr. `sbUser.id` kad sesija u međuvremenu nestane,
    // ili nedostajuće polje u DOM-u — izletjelo bi nečujno: modal ostane otvoren,
    // dugme "Sačuvaj" izgleda mrtvo (sljedeći tap samo ponovi isti pad), a
    // #tab-bar i #action-bar OSTAJU SAKRIVENI jer dozCancelDraw() nikad ne
    // stigne da se izvrši — korisnik ostane bez navigacije i bez objašnjenja.
    showToast('⚠ Zona nije sačuvana: ' + (e?.message || e));
    try { document.getElementById('doz-save-modal').style.display = 'none'; } catch(e2) {}
    // Isti ishod kao dozCancelSave: poligon se odbacuje (da zaostao
    // _dozPendingSavePolygon ne bi kasnije ušao u tuđi upis), a UI se vraća u
    // ispravno stanje. Uzrok je najčešće trajan do ponovne prijave, pa je
    // čist ekran korisniji od modala koji se ne da spasiti.
    _dozPendingSavePolygon = null;
    dozCancelDraw();   // vraća #tab-bar/#action-bar i čisti stanje crtanja
  } finally {
    _dozSaveInFlight = false;
  }
}

function _dozCalcArea(pts) {
  if (pts.length < 3) return 0;
  const MPDEG = 111320;
  let area = 0; const n = pts.length;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const xi = pts[i].lng * MPDEG * Math.cos(pts[i].lat * Math.PI / 180);
    const yi = pts[i].lat * MPDEG;
    const xj = pts[j].lng * MPDEG * Math.cos(pts[j].lat * Math.PI / 180);
    const yj = pts[j].lat * MPDEG;
    area += xi * yj - xj * yi;
  }
  return Math.abs(area) / 2;
}

// ─── Delete Marking ────────────────────────────────────────────────
async function dozDeleteMarking(id) {
  if (!await _dlgConfirm('Obriši obilježenu zonu?', { danger: true })) return;
  // D4-B: markica kreirana offline (još nema pravi server ID) — insert nikad nije stigao
  // na server, pa "brisanje" mora otkazati red čekanja umjesto da gađa nepostojeći ID.
  if (String(id).startsWith('local_')) {
    const q = _OL.loadQueue();
    const hasQueued = q.some(o => o.type === 'insert_doz_marking' && o._localId === id);
    if (hasQueued) {
      localStorage.setItem(_OL.QUEUE, JSON.stringify(q.filter(o => !(o.type === 'insert_doz_marking' && o._localId === id))));
    }
    _dozMarkings = _dozMarkings.filter(m => m.id !== id);
    // Keš mora pratiti — inače se zona vrati pri sljedećem otvaranju bez signala.
    _dozCacheLayers(_dozSelId);
    dozRenderMapLayers();
    dozRenderDetail();
    showToast(hasQueued ? '🗑 Zona uklonjena (nikad nije stigla na server)' : '🗑 Zona uklonjena lokalno');
    return;
  }
  try {
    if (!_serverSlanjeDozvoljeno() || !_mrezaProbaj()) throw new Error('offline');
    const { error } = await sb.from('doz_area_markings').update({ is_visible: false }).eq('id', id);
    if (error) throw error;
    showToast('🗑 Zona obrisana');
    await dozLoadLayers(_dozSelId);
    dozRenderDetail();
  } catch(e) {
    _OL.enqueue({ type: 'delete_doz_marking', payload: { id } });
    // Ranije je zona ostajala na karti i u kešu, pa je izgledalo da brisanje
    // nije uspjelo (i drugi tap je stavljao isto brisanje ponovo u red).
    _dozMarkings = _dozMarkings.filter(m => m.id !== id);
    _dozCacheLayers(_dozSelId);
    dozRenderMapLayers();
    dozRenderDetail();
    showToast('🗑 Zona uklonjena — kolegama nestaje kad pošalješ (Meni → Server)');
  }
}

async function dozDeleteOdjel() {
  const odjel = _dozOdjeli.find(o => o.id === _dozSelId);
  if (!odjel) return;
  // Samo kreator ili manager smije brisati — briše podatke cijelog tima
  const myRole = _dozMembers.find(m => m.user_id === sbUser?.id)?.role;
  const canDelete = odjel.created_by === sbUser?.id || myRole === 'manager';
  if (!canDelete) { showToast('Samo kreator/manager može obrisati odjel'); return; }
  // Briše podatke cijelog tima u četiri koraka — bez veze bi pao na pola i
  // ostavio odjel djelimično obrisan, pa se ni ne počinje.
  if (!_mrezaProbaj()) { showToast('📴 Brisanje odjela traži vezu — pokušaj kad bude signala'); return; }
  if (!await _dlgConfirm(`Obriši odjel "${odjel.name}"? Ovo nepovratno briše GPS tragove, zone i članstva za CIJELI tim.`, { danger: true })) return;
  try {
    // Eksplicitno počisti child redove (ne oslanjaj se na DB CASCADE → bez orphana)
    const { error: et } = await sb.from('doz_track_points').delete().eq('project_id', _dozSelId);
    if (et) throw et;
    const { error: ea } = await sb.from('doz_area_markings').delete().eq('project_id', _dozSelId);
    if (ea) throw ea;
    const { error: em } = await sb.from('doz_project_members').delete().eq('project_id', _dozSelId);
    if (em) throw em;
    const { error } = await sb.from('doz_projects').delete().eq('id', _dozSelId);
    if (error) throw error;
    showToast('🗑 Odjel obrisan');
    dozBackToList();
    await dozLoadOdjeli();
  } catch(e) { showToast('Greška: ' + e.message); }
}

function dozCreateLoadGeojson(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.features?.length) { showToast('Fajl nema features'); return; }
      _dozCreateFeatures = data.features
        .filter(f => f.geometry)
        .map(f => ({
          gj:       (f.properties?.GJ      || f.properties?.gj      || '').trim(),
          odjel:    String(f.properties?.ODJEL   || f.properties?.odjel   || '').trim(),
          odsjek:   String(f.properties?.ODSJEK  || f.properties?.odsjek  || '').trim(),
          gazKlasa: String(f.properties?.Gaz_Klasa_ || f.properties?.GAZ_KLASA || '').trim(),
          geometry: f.geometry
        }))
        .filter(f => f.gj && f.odjel);
      const gjCount = new Set(_dozCreateFeatures.map(f => f.gj)).size;
      const st = document.getElementById('doz-gjson-status');
      st.textContent = `${_dozCreateFeatures.length} odsjeka · ${gjCount} GJ učitano`;
      st.style.color = '#4ade80';
      _dozCreateRenderGjField();
      showToast(`✅ GeoJSON: ${_dozCreateFeatures.length} odsjeka`);
    } catch(ex) { showToast('❌ GeoJSON greška: ' + ex.message); }
  };
  reader.readAsText(file);
}

function _dozCreateOnOdjelChange() {
  _dozCreateOdjel = (document.getElementById('doz-create-odjel')?.value || '').trim();
  document.getElementById('doz-create-error').textContent = '';
  const noPoly = document.getElementById('doz-create-no-poly');
  const polyOk = document.getElementById('doz-create-poly-ok');

  if (!_dozCreateOdjel) {
    noPoly.style.display = 'none'; polyOk.style.display = 'none';
    return;
  }

  // Pokuša naći poligon iz učitanog GeoJSON-a (isključi Gaz_Klasa_ s '8000')
  const odsjeci = _dozCreateFeatures.filter(f =>
    (!_dozCreateGj || f.gj === _dozCreateGj) &&
    f.odjel === _dozCreateOdjel &&
    !f.gazKlasa.includes('8000')
  );

  if (odsjeci.length > 0) {
    _dozCreateBoundary = _dozMergeOdsjeci(odsjeci);
    _dozCreateAreaHa   = _dozCalcGeomAreaHa(_dozCreateBoundary);
    polyOk.style.display = 'block';

    noPoly.style.display = 'none';
  } else if (_dozCreateBoundary) {
    // Granica ucrtana ručno
    polyOk.style.display = 'block'; noPoly.style.display = 'none';
  } else {
    noPoly.style.display = 'block'; polyOk.style.display = 'none';
  }
}

function _dozMergeOdsjeci(odsjeci) {
  if (odsjeci.length === 1) return odsjeci[0].geometry;
  const polys = [];
  for (const f of odsjeci) {
    const g = f.geometry;
    if (g.type === 'Polygon')      polys.push(g.coordinates);
    else if (g.type === 'MultiPolygon') g.coordinates.forEach(p => polys.push(p));
  }
  return polys.length === 1
    ? { type: 'Polygon', coordinates: polys[0] }
    : { type: 'MultiPolygon', coordinates: polys };
}

function _dozCalcGeomAreaHa(geom) {
  if (!geom) return 0;
  const ringArea = ring => {
    const R = 6371000;
    const cos = Math.cos(ring[0][1] * Math.PI / 180);
    let a = 0;
    for (let i = 0; i < ring.length; i++) {
      const p1 = ring[i], p2 = ring[(i+1) % ring.length];
      const x1 = p1[0]*Math.PI/180*R*cos, y1 = p1[1]*Math.PI/180*R;
      const x2 = p2[0]*Math.PI/180*R*cos, y2 = p2[1]*Math.PI/180*R;
      a += x1*y2 - x2*y1;
    }
    return Math.abs(a/2) / 10000;
  };
  if (geom.type === 'Polygon')      return ringArea(geom.coordinates[0]);
  if (geom.type === 'MultiPolygon') return geom.coordinates.reduce((s,p) => s + ringArea(p[0]), 0);
  return 0;
}

function _dozKmlSelToggle(layer) {
  const idx = _dozKmlSelLayers.indexOf(layer);
  if (idx >= 0) {
    _dozKmlSelLayers.splice(idx, 1);
    try { layer.setStyle(layer._kmlOrigStyle || { fillOpacity: 0.2, weight: 1 }); } catch(e) {}
  } else {
    if (!layer._kmlOrigStyle) {
      layer._kmlOrigStyle = {
        color:       layer.options.color       || '#3388ff',
        fillColor:   layer.options.fillColor   || '#3388ff',
        fillOpacity: layer.options.fillOpacity ?? 0.2,
        weight:      layer.options.weight      || 1,
        opacity:     layer.options.opacity     ?? 1
      };
    }
    layer.setStyle({ color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 0.4, weight: 3 });
    _dozKmlSelLayers.push(layer);
  }
  _dozKmlSelUpdateInfo();
}

function _dozKmlSelUpdateInfo() {
  const n = _dozKmlSelLayers.length;
  let ha = 0;
  if (n > 0 && typeof turf !== 'undefined') {
    _dozKmlSelLayers.forEach(l => {
      try {
        const gj = _dozKmlLayerToGeoJSON(l);
        if (gj) ha += turf.area(gj) / 10000;
      } catch(e) {}
    });
  }
  document.getElementById('doz-kmlsel-info').textContent = `${n} poligon${n===1?'':'a'} · ${fmtHa(ha)}`;
}

function _dozKmlLayerToGeoJSON(layer) {
  if (typeof layer.toGeoJSON === 'function') return layer.toGeoJSON();
  if (layer.getLatLngs) {
    const rings = layer.getLatLngs();
    const toCoords = ring => (Array.isArray(ring[0]) ? ring : [ring]).map(r =>
      (Array.isArray(r) ? r : [r]).map(p => [p.lng ?? p[1], p.lat ?? p[0]])
    );
    const coords = toCoords(rings);
    return { type: 'Feature', geometry: { type: 'Polygon', coordinates: coords } };
  }
  return null;
}

function dozConfirmKmlSel() {
  if (!_dozKmlSelLayers.length) { showToast('⚠ Nijedan poligon nije izabran'); return; }
  let merged = null;
  let totalHa = 0;
  if (typeof turf !== 'undefined') {
    try {
      const features = _dozKmlSelLayers.map(l => {
        const gj = _dozKmlLayerToGeoJSON(l);
        return gj && gj.type === 'Feature' ? gj : turf.feature(gj);
      }).filter(Boolean);
      merged = features.length === 1 ? features[0] : features.reduce((acc, f) => turf.union(acc, f));
      totalHa = turf.area(merged) / 10000;
    } catch(e) {
      showToast('Greška pri spajanju poligona: ' + e.message); return;
    }
  } else {
    const gj = _dozKmlLayerToGeoJSON(_dozKmlSelLayers[0]);
    merged = gj; totalHa = 0;
  }
  _dozCreateBoundary = merged && merged.geometry ? merged.geometry : merged;
  _dozCreateAreaHa   = totalHa;
  _dozKmlSelMode = false;
  _dozKmlSelLayers.forEach(l => { try { l.setStyle(l._kmlOrigStyle || {}); } catch(e){} });
  _dozKmlSelLayers = [];
  document.getElementById('doz-kmlsel-banner').style.display = 'none';
  document.getElementById('action-bar').style.display = '';
  document.getElementById('tab-bar').style.display = '';
  map.invalidateSize();
  _dozNewOdjelDrawGj    = _dozKmlSelSavedGj;
  _dozNewOdjelDrawOdjel = _dozKmlSelSavedOdjel;
  dozShowCreateOdjel(true);
}

  const btn = document.getElementById('doz-draw-toggle');
  const ico = document.getElementById('doz-draw-check');
  btn.classList.toggle('on', _dozDrawEnabled);
  if (ico) ico.textContent = _dozDrawEnabled ? '☑' : '☐';
  if (_dozDrawEnabled) {
    _dozDragLastPt = null;
    map.on('move', _onDozDragMove);
    document.getElementById('main').classList.add('drawing-active');
    document.getElementById('main').classList.add('draw-drag-on');
  } else {
    map.off('move', _onDozDragMove);
    document.getElementById('main').classList.remove('drawing-active');
    document.getElementById('main').classList.remove('draw-drag-on');
  }
}

function _onDozDragMove() {
  if (!_dozDrawEnabled || _dozDrawType === null) return;
  const c = map.getCenter();
  if (_dozDragLastPt) {
    const d = dst(_dozDragLastPt.lat, _dozDragLastPt.lng, c.lat, c.lng);
    if (d < DOZ_DRAG_MIN_M) return;
  }
  _dozDragLastPt = { lat: c.lat, lng: c.lng };
  dozAddDrawPoint(c);
}

function _dozDrawCleanup() {
  map.off('move', _onDozDragMove);
  _dozDrawEnabled = false;
  _dozDragLastPt = null;
  document.getElementById('main').classList.remove('drawing-active');
  document.getElementById('main').classList.remove('draw-drag-on');
  _mcdRestoreVisibility();
}

function dozAddPointAtCenter() {
  const c = map.getCenter();
  dozAddDrawPoint(c);
  showToast(`📍 Tačka dodana (${_dozDrawPts.length})`);
}

async function dozSaveOdjel() {
  const gj    = (document.getElementById('doz-create-gj')?.value    || '').trim().toUpperCase();
  const odjel = (document.getElementById('doz-create-odjel')?.value || '').trim();
  const err   = document.getElementById('doz-create-error');
  if (!gj)    { err.textContent = 'Unesite GJ'; return; }
  if (!odjel) { err.textContent = 'Unesite odjel'; return; }
  if (!_dozCreateBoundary) { err.textContent = 'Učitajte GeoJSON ili ucrtajte granicu odjela'; return; }
  err.textContent = '';

  const payload = {
    name: `${gj} · ${odjel}`,
    description: null,
    created_by: sbUser.id,
    boundary_geojson: _dozCreateBoundary,
    known_area_ha: _dozCreateAreaHa || null,
    status: 'active'
  };

  const id = _genUUID();
  payload.id = id;
  const novi = { ...payload, created_at: new Date().toISOString(), _pendingSync: true };
  if (!_OL.enqueue({ type: 'insert_doz_project', payload: { ...payload, _tempId: id } })) {
    err.textContent = 'Lokalni upis nije uspio. Odjel nije sačuvan; pokušaj ponovo.';
    return;
  }
  _dozOdjeli.unshift(novi);
  _OL.save(_OL.DOZ_ODJELI, _dozOdjeli);
  dozCloseCreateOdjel(); dozRenderOdjeli(); _dozRenderOverview();
  showToast('📋 Odjel sačuvan — na server ide kroz Meni → Server');
  _processOfflineQueue().catch(() => {});   // red sam odlučuje o vezi

}

// ─── Add Member (šumarija lista) ──────────────────────────────────
async function dozAddMember() {
  if (!_mrezaProbaj()) { showToast('📴 Dodavanje projektanta traži vezu'); return; }
  try {
    const { data: me, error: eMe } = await sb.from('korisnici').select('sumarija').eq('id', sbUser.id).single();
    // Mrežna greška nije "nisi registrovan u šumariji" — ranije je poruka lagala.
    if (eMe && _isNetworkErr(eMe)) throw eMe;
    if (!me?.sumarija) { showToast('Nisi registrovan u šumariji'); return; }
    const { data: users, error: eUsers } = await sb.from('korisnici')
      // `*` — je_vodeci postoji tek nakon migracije 20260727 (vidi sbLoadKolege)
      .select('*').eq('sumarija', me.sumarija).neq('id', sbUser.id).order('prezime');
    if (eUsers) throw eUsers;
    if (!users?.length) { showToast('Nema projektanata u šumariji'); return; }
    const vecClanovi = new Set(_dozMembers.map(m => m.user_id));
    // Vodeći Projektant je nadzorni nalog (isti obrazac kao kod dodavanja u vlake
    // projekat) — ne snima doznaku, ne treba se nuditi kao kandidat za tim.
    // je_vodeci je prava kolona od 20260727_pristup_odobrenje.sql; regex nad
    // imenom ostaje kao fallback za redove učitane prije migracije.
    const dostupni = users.filter(u => !vecClanovi.has(u.id)
      && !u.je_vodeci && !/^vode[cć]i\s+projektant$/i.test((u.ime || '').trim()));
    if (!dostupni.length) { showToast('Svi projektanti su već dodani'); return; }
    _dozShowMemberPicker(dostupni);
  } catch(e) { showToast('Greška: ' + e.message); }
}

function _dozShowMemberPicker(users) {
  const existing = document.getElementById('doz-member-picker');
  if (existing) existing.remove();
  const rows = users.map(u => {
    const initials = ((u.ime||'')[0]||(u.prezime||'')[0]||'?').toUpperCase() +
                     ((u.prezime||'')[1]||'').toUpperCase();
    const color = u.boja || DOZ_ENG_COLORS[0];
    return `<div style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid #1e293b;">
      <div style="width:30px;height:30px;border-radius:50%;background:${color}22;border:1px solid ${color};
        display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${color};flex-shrink:0;">${_escHtml(initials)}</div>
      <div style="flex:1;font-size:13px;color:#e2e8f0;">${_escHtml(u.ime||'')} ${_escHtml(u.prezime||'')}</div>
      <button onclick="_dozPickMember('${u.id}')" style="background:#166534;border:1px solid #4ade80;color:#4ade80;border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap;">Dodaj</button>
    </div>`;
  }).join('');
  const modal = document.createElement('div');
  modal.id = 'doz-member-picker';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:flex-end;justify-content:center;z-index:2000;padding:0 0 0 0;';
  modal.innerHTML = `<div style="background:#16213e;border:1px solid #1e3a5f;border-radius:14px 14px 0 0;padding:16px;width:100%;max-width:400px;max-height:70vh;max-height:70dvh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;color:#e2e8f0;">Dodaj projektanta</div>
      <button onclick="document.getElementById('doz-member-picker').remove()" style="background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;padding:0 4px;"><svg class="ic"><use href="#ic-zatvori"/></svg></button>
    </div>
    <div style="font-size:11px;color:#475569;margin-bottom:10px;">Projektanti iz iste šumarije</div>
    ${rows}
  </div>`;
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  document.body.appendChild(modal);
}

async function _dozPickMember(userId) {
  document.getElementById('doz-member-picker')?.remove();
  if (!_mrezaProbaj()) { showToast('📴 Dodavanje projektanta traži vezu'); return; }
  try {
    const { error } = await sb.from('doz_project_members').insert({
      project_id: _dozSelId, user_id: userId, role:'engineer',
      track_color: DOZ_ENG_COLORS[_dozMembers.length % DOZ_ENG_COLORS.length],
      order_index: _dozMembers.length, is_active: true
    });
    if (error) { if (error.code==='23505') { showToast('Projektant je već član'); return; } throw error; }
    showToast('✅ Projektant dodan');
    await dozLoadLayers(_dozSelId);
    dozRenderDetail();
  } catch(e) { showToast('Greška: ' + e.message); }
}

// ─── Back to List ─────────────────────────────────────────────────
function dozBackToList() {
  _dozSelId = null;
  _OL.save(_OL.DOZ_SEL_ID, null);
  _dozSubProject(null);
  dozStopGPS();
  dozCancelDraw();
  if (_dozVlakeVisible) dozToggleVlake();   // toggle sam gasi flag i skida slojeve
  dozClearBuf();
  dozTreesClear();
  [_dozBoundaryLayer, _dozTracksLayer, _dozMarkingsLayer, _dozBandsLayer, _dozGpsTrackLayer].forEach(l => { if (l) map.removeLayer(l); });
  _dozBoundaryLayer = _dozTracksLayer = _dozMarkingsLayer = _dozBandsLayer = _dozGpsTrackLayer = null;
  document.getElementById('doz-panel-list').style.display   = 'flex';
  document.getElementById('doz-panel-detail').style.display = 'none';
  dozRenderOdjeli();
  _dozRenderOverview();
}

// === ANDROID APK DOWNLOAD BRIDGE ===
// WebView ne podržava <a download>.click() za blob: URL-ove.
// Interceptujemo klik i šaljemo podatke Android-u preko JavascriptInterface.
if (typeof AndroidDownload !== 'undefined') {
  (function() {
    const origClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function() {
      if (this.download && this.href && this.href.startsWith('blob:')) {
        const filename = this.download || 'download';
        fetch(this.href).then(r => r.blob()).then(blob => {
          const reader = new FileReader();
          reader.onload = () => AndroidDownload.save(filename, reader.result);
          reader.readAsDataURL(blob);
        }).catch(() => origClick.call(this));
        return;
      }
      origClick.call(this);
    };
  })();
}

          <div class="help-diagram">Oznake panel se otvara automatski i prikazuje sve slojeve vidljive na mapi. Tap na sloj otvara editor boja i stilova.</div>
          <div class="help-row">
            <div class="help-icon">📂</div>
            <div class="help-txt"><b>Učitani fajlovi (lokalni)</b><span>KML fajlovi koje ste ručno učitali sa uređaja. Čuvaju se lokalno u browseru. Možete ih preimenovati, promijeniti boju, providnost i uzorak punjenja, te dodati tag/odjel za pretragu.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🌐</div>
            <div class="help-txt"><b>Server fajlovi</b><span>KML fajlovi sa Supabase servera, grupisani po GJ (Gospodarskoj jedinici). Svaka GJ je sklopiva grupa — tapnite na naziv GJ da proširite ili skupite listu.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">📡</div>
            <div class="help-txt"><b>GPS tragovi</b><span>Snimljeni GPS putevi. Prikazuju se kao linije na mapi u boji dodijeljenoj korisniku.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">📷</div>
            <div class="help-txt"><b>Foto oznake</b><span>Fotografije snimljene na lokaciji. Prikazuju se kao markeri na mapi. Mogu se dijeliti s kolegama.</span></div>
          </div>
        </div>
      </div>

      <div class="help-sec">
        <div class="help-sec-hdr" onclick="toggleHelpSec(this)">
          <span class="h-arrow">▶</span>🛠 Alati iz menija
        </div>
        <div class="help-sec-body">
          <div class="help-row">
            <div class="help-icon">📡</div>
            <div class="help-txt"><b>GPS</b><span>Uključi/isključi GPS snimanje lokacije u realnom vremenu. Tačka plave boje prikazuje vašu poziciju na mapi.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">⬆</div>
            <div class="help-txt"><b>KML Export</b><span>Izvoz svih vlaka i slojeva u KML format za Google Earth ili GIS softver.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🗺</div>
            <div class="help-txt"><b>Offline karte</b><span>U prozoru karte (dugme za slojeve) → <b>📂 Dodaj / upravljaj offline kartama</b> učitajte .mbtiles / .sqlitedb kartu za rad bez interneta. Online prikazi (satelit, topo...) se automatski pamte dok ste online i rade i offline — zauzeće memorije i brisanje su u istom prozoru, ispod zaglavlja.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">📂</div>
            <div class="help-txt"><b>Dodaj KML fajl</b><span>Učitaj KML fajl s uređaja i prikaži ga na mapi kao poseban sloj. Pojavljuje se u sekciji "Učitani fajlovi".</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🔑</div>
            <div class="help-txt"><b>Promijeni PIN</b><span>Promjena vlastitog PIN-a za prijavu. Ako ste PIN zaboravili, na login ekranu tapnite "Zaboravljen PIN?" — administrator ga resetuje.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">📷</div>
            <div class="help-txt"><b>Uslikaj lokaciju</b><span>Uslikajte tačku na terenu — foto se veže za GPS koordinate i pojavljuje na mapi kao marker.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🏷</div>
            <div class="help-txt"><b>Tekst na karti</b><span>Dodajte tekstualnu oznaku direktno na mapu — korisno za napomene i reference tačaka.</span></div>
          </div>
        </div>
      </div>

    </div><!-- /gen -->

    <!-- ── VLAKE ───────────────────────────────── -->
    <div id="help-pane-vlake" style="display:none;">

      <div class="help-sec">
        <div class="help-sec-hdr" onclick="toggleHelpSec(this)">
          <span class="h-arrow">▶</span>📋 Pregled vlaka
        </div>
        <div class="help-sec-body">
          <div class="help-row">
            <div class="help-icon">📋</div>
            <div class="help-txt"><b>Moje Vlake</b><span>Popis svih vlaka u aktivnom projektu. Svaka vlaka prikazuje naziv, ukupnu dužinu (u metrima) i boju traga. Tapnite na vlaku da je odaberete i centrirate na mapi.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">👁</div>
            <div class="help-txt"><b>Vidljivost</b><span>Svaka vlaka ima gumb 👁 za uključivanje/isključivanje prikaza na mapi bez brisanja podataka.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">👥</div>
            <div class="help-txt"><b>Vlake kolega</b><span>Ispod vaših vlaka prikazuje se sekcija "Vlake kolega" sa vlakama svih projektanata na istom projektu. Svaki projektant ima svoju boju — odmah se vidi ko je projektovao koju vlaku. Promjene se sinhronizuju u realnom vremenu.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🎨</div>
            <div class="help-txt"><b>Boje vlaka</b><span>U Projekat tabu postoji sekcija "Boje vlaka" gdje birate boju za glavne vlake i krakove (isti projektant — ista boja).</span></div>
          </div>
        </div>
      </div>

      <div class="help-sec">
        <div class="help-sec-hdr" onclick="toggleHelpSec(this)">
          <span class="h-arrow">▶</span>📡 GPS snimanje vlake
        </div>
        <div class="help-sec-body">
          <div class="help-diagram" style="border-color:#4ade80;">
            <b style="color:#4ade80;">Primarni način rada</b><br>
            GPS snimanje je glavni alat za projektovanje vlake na terenu. Uključite snimanje, hodajte trasom buduće vlake, a app automatski bilježi GPS tačke i crta liniju na mapi. Na vrhu ekrana pojavljuje se crveni baner sa statistikama i kontrolama.
          </div>
          <ul class="help-steps">
            <li data-n="1.">Aktivirajte projekat u <b>Projekat</b> tabu</li>
            <li data-n="2.">Otvorite <b>Vlake</b> tab i odaberite vlaku (ili dodajte novu)</li>
            <li data-n="3.">Pritisnite <b>▶ Snimi GPS</b> na vlaki — pojavljuje se modal za izbor</li>
            <li data-n="4.">Kod nove matične vlake odmah na početku (na kamionskom putu) nudi se <b>broj lagera</b> — potvrdite, izmijenite, odaberite postojeći lager u blizini ili preskočite (ponudiće se ponovo na kraju)</li>
            <li data-n="5.">Odaberite <b>▶ Snimi direktno</b> za nastavak matične trase, ili <b>⊕ Lijevi krak</b> / <b>⊕ Desni krak</b> za odvajanje</li>
            <li data-n="6.">Hodajte trasom — baner prikazuje dužinu, broj tačaka i nagib terena</li>
            <li data-n="7.">Pritisnite <b>⏹ Stop</b> za završetak snimanja</li>
          </ul>
        </div>
      </div>

      <div class="help-sec">
        <div class="help-sec-hdr" onclick="toggleHelpSec(this)">
          <span class="h-arrow">▶</span>🔀 Krakovi vlake (L / D)
        </div>
        <div class="help-sec-body">
          <div class="help-diagram" style="border-color:#f97316;">
            <b style="color:#f97316;">Šta je krak?</b><br>
            Krak je bočno odvajanje od matične (glavne) trase vlake — uvijek nastaje spojen na maticu. Svaka vlaka može imati neograničen broj lijevih i desnih krakova, a krak može imati i svoje krakove (npr. T5.6.5 = treći lijevi krak sa kraka T5.6).
          </div>
          <div class="help-diagram">
            <b>Numeracija:</b> lijevi krakovi su <b style="color:#38bdf8;">neparni</b> (T4.1, T4.3, T4.5...), desni su <b style="color:#f97316;">parni</b> (T4.2, T4.4, T4.6...). Kratki pritisak na ⊕L/⊕D dodjeljuje sljedeći slobodan broj (prikazan na dugmetu). Krakovi se ne moraju snimati strogo redom — <b>dugi pritisak</b> na ⊕L/⊕D otvara ručni izbor broja (npr. odmah 5.6 i kad 5.4 još ne postoji).
          </div>
          <div class="help-row">
            <div class="help-icon" style="color:#38bdf8;font-size:16px;">⊕ L</div>
            <div class="help-txt"><b style="color:#38bdf8;">Lijevi krak (neparni)</b><span>Kreira novi lijevi krak spojen na najbližu tačku matice. Dugi pritisak = ručni izbor broja.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon" style="color:#f97316;font-size:16px;">⊕ D</div>
            <div class="help-txt"><b style="color:#f97316;">Desni krak (parni)</b><span>Isto kao lijevi, ali za desnu stranu vlake. Dugi pritisak = ručni izbor broja.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">↪</div>
            <div class="help-txt"><b>Nastavi postojeći krak</b><span>Ako ste ranije prekinuli snimanje kraka, tapnite ↪ da nastavite od tačke gdje ste stali.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">↩</div>
            <div class="help-txt"><b>Vrati na roditelja</b><span>Kad završite krak, tapnite ↩ — GPS se automatski pauzira dok hodate nazad do matice (povratak se ne snima), a na matici pritisnite ▶ za nastavak. Već snimljeni dio matice iza spoja se čuva.</span></div>
          </div>
        </div>
      </div>

      <div class="help-sec">
        <div class="help-sec-hdr" onclick="toggleHelpSec(this)">
          <span class="h-arrow">▶</span>🎛 Kontrole snimanja (baner)
        </div>
        <div class="help-sec-body">
          <div class="help-diagram">Tokom GPS snimanja, na vrhu ekrana pojavljuje se baner sa kontrolama. Evo šta svaki gumb radi:</div>
          <div class="help-row">
            <div class="help-icon">⏸</div>
            <div class="help-txt"><b>Pauza / Nastavi</b><span>Privremeno pauzira GPS snimanje (npr. kad stojite na jednom mjestu). Tapnite ponovo za nastavak. Tokom pauze, tačke se ne bilježe.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon" style="color:#38bdf8;">⊕ L</div>
            <div class="help-txt"><b>Novi lijevi krak</b><span>Kreće snimanje novog lijevog (neparnog) kraka od trenutne pozicije. Dugi pritisak — ručni izbor broja kraka.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon" style="color:#f97316;">⊕ D</div>
            <div class="help-txt"><b>Novi desni krak</b><span>Kreće snimanje novog desnog (parnog) kraka od trenutne pozicije. Dugi pritisak — ručni izbor broja kraka.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">↪</div>
            <div class="help-txt"><b>Nastavi krak</b><span>Otvara listu postojećih krakova i nastavlja snimanje od kraja odabranog.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">↩</div>
            <div class="help-txt"><b>Vrati na roditelja</b><span>Završava trenutni krak i nastavlja snimanje matične trase.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🔓</div>
            <div class="help-txt"><b>Slobodan pogled</b><span>Normalno mapa prati vašu GPS poziciju. Tapnite 🔓 da otključate mapu i slobodno je pomičete/zumirate. Tapnite ponovo da se vratite na praćenje pozicije.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon" style="color:#f87171;">⏹</div>
            <div class="help-txt"><b>Stop</b><span>Završava snimanje. Svi podaci se automatski čuvaju.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🔒</div>
            <div class="help-txt"><b>Wake Lock</b><span>Tokom snimanja, ekran automatski ostaje uključen (ikona 🔒 u baneru). Ovo sprečava gašenje ekrana i gubitak GPS signala.</span></div>
          </div>
        </div>
      </div>

      <div class="help-sec">
        <div class="help-sec-hdr" onclick="toggleHelpSec(this)">
          <span class="h-arrow">▶</span>✏ Ručno crtanje vlake
        </div>
        <div class="help-sec-body">
          <div class="help-diagram">Osim GPS snimanja, vlaku možete nacrtati ručno na mapi — korisno za planiranje u uredu ili doradu trase.</div>
          <ul class="help-steps">
            <li data-n="1.">U <b>Projekat</b> tabu tapnite <b>✏ Nacrtaj vlaku ručno</b>, ili odaberite vlaku i tapnite ikonu za crtanje</li>
            <li data-n="2.">Pojavljuje se baner sa alatima za crtanje</li>
            <li data-n="3.">Tapkajte na mapu da dodate tačke — linija se crta između tačaka</li>
            <li data-n="4.">Koristite kontrole u baneru (opisane ispod)</li>
            <li data-n="5.">Pritisnite <b>✓ Završi</b> kad ste zadovoljni trasom</li>
          </ul>
          <div class="help-row" style="margin-top:8px;">
            <div class="help-icon">↩</div>
            <div class="help-txt"><b>Undo</b><span>Uklanja zadnju dodanu tačku.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">✍</div>
            <div class="help-txt"><b>Vuci modus</b><span>Umjesto tapkanja po tačkama, povucite prst po mapi da kontinuirano crtate liniju — idealno za slobodne oblike.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">📍</div>
            <div class="help-txt"><b>Tačka (centar)</b><span>Dodaje tačku na centar ekrana (nišan) — precizno pozicioniranje bez tapkanja.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon" style="color:#4ade80;">✓</div>
            <div class="help-txt"><b>Završi</b><span>Završava crtanje i čuva vlaku. Tačke se odmah sinhronizuju na server.</span></div>
          </div>
        </div>
      </div>

      <div class="help-sec">
        <div class="help-sec-hdr" onclick="toggleHelpSec(this)">
          <span class="h-arrow">▶</span>📏 Mjerenja i profil terena
        </div>
        <div class="help-sec-body">
          <div class="help-row">
            <div class="help-icon">📏</div>
            <div class="help-txt"><b>Mjerenje distance</b><span>Iz menija otvorite "📏 Mjerenja & Tragovi". Tapkajte tačke na mapi da izmjerite razdaljinu. Prikazuje ukupnu dužinu, uspon, silaz i (ako zatvoreno) površinu.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon" style="background:#4ade8022;">⬆</div>
            <div class="help-txt"><b style="color:#4ade80;">Uspon</b><span>Ukupna visinska razlika uzlaznih dionica (zelena). Izračunava se iz DEM podataka (digitalni model terena).</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon" style="background:#f8717122;">⬇</div>
            <div class="help-txt"><b style="color:#f87171;">Silaz</b><span>Ukupna visinska razlika silaznih dionica (crvena).</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon" style="background:#a78bfa22;">◻</div>
            <div class="help-txt"><b style="color:#a78bfa;">Površina</b><span>Ako su tačke zatvorene u poligon, prikazuje se površina u m² i hektarima (ljubičasta).</span></div>
          </div>
        </div>
      </div>

      <div class="help-sec">
        <div class="help-sec-hdr" onclick="toggleHelpSec(this)">
          <span class="h-arrow">▶</span>🔲 Buffer zone
        </div>
        <div class="help-sec-body">
          <div class="help-diagram">Buffer zone prikazuju područje zahvata oko svake vlake. Koriste se za provjeru pokrivenosti — da li su sve dijelove odjela moguće doseći s postojećih vlaka.</div>
          <ul class="help-steps">
            <li data-n="1.">Odaberite <b>širinu buffera</b> iz padajućeg menija: 60m, 80m (default), 100m ili 120m (računajući po pola na svaku stranu)</li>
            <li data-n="2.">Opciono: promijenite <b>boju</b> buffera (klik na kvadratić boje) i <b>prozirnost</b> (klizač)</li>
            <li data-n="3.">Tapnite <b>🔲 PRIKAŽI BUFFERE</b> da prikažete zone na mapi</li>
            <li data-n="4.">Tapnite <b>✕ UKLONI BUFFERE</b> da ih skinete</li>
          </ul>
          <div class="help-row" style="margin-top:6px;">
            <div class="help-icon col" style="background:#60a5fa33;border:2px solid #60a5fa;">
              &nbsp;&nbsp;&nbsp;
            </div>
            <div class="help-txt"><b style="color:#60a5fa;">Buffer zona</b><span>Poluprovidna zona oko vlake u odabranoj boji — prikazuje doseg zahvata.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon col" style="background:#ef444455;border:2px solid #ef4444;">
              &nbsp;&nbsp;&nbsp;
            </div>
            <div class="help-txt"><b style="color:#ef4444;">Mrtva zona (preklapanje)</b><span>Crvena zona — gdje se bufferi dvije ili više vlaka preklapaju. Uvijek crvena, ne mijenja se.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🔗</div>
            <div class="help-txt"><b>Spoji vlake</b><span>Spaja dvije vlake u jednu: kliknite na krajnju tačku (zelenu/crvenu) jedne vlake, pa na krajnju tačku druge.</span></div>
          </div>
        </div>
      </div>

      <div class="help-sec">
        <div class="help-sec-hdr" onclick="toggleHelpSec(this)">
          <span class="h-arrow">▶</span>🗺 Referentna karta i detekcija
        </div>
        <div class="help-sec-body">
          <div class="help-diagram">Učitajte sliku papirne karte (1:10000) ili ortofota i preklopite je na digitalnu mapu. Koristite za prijenos vlaka s papira u digitalni format ili kao vizualnu podlogu.</div>
          <div class="help-row">
            <div class="help-icon">📷</div>
            <div class="help-txt"><b>Učitaj sliku karte</b><span>Odaberite sliku (foto ili sken) s uređaja. Pojavljuje se preklopljena na mapi.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">📐</div>
            <div class="help-txt"><b>Fituj u prikaz / Fituj u odjel</b><span>Postavi sliku na trenutni prikaz mape, ili na učitani KML odjel da se poklopi sa granicama.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🎯</div>
            <div class="help-txt"><b>Precizno poravnaj</b><span>Automatski pronalazi granicu odjela na slici i poravnava je na KML poligon. Radi kada slika jasno prikazuje granicu odjela.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🎯</div>
            <div class="help-txt"><b>Kalibriraj (kontrolne tačke)</b><span>Ručna kalibracija: kliknite na prepoznatljivu tačku na slici (npr. raskrsnica, kota), pa kliknite istu tačku na mapi. Ponovite za 2–3 tačke za precizno poravnanje.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">🔍</div>
            <div class="help-txt"><b>Automatska detekcija vlaka</b><span>Algoritam pokušava prepoznati trase vlaka iz slike koristeći kontrast. Podesite "Prag tame" i "Min. dužina" klizačima za bolje rezultate. Detektovane vlake se prikazuju kao narandžaste linije.</span></div>
          </div>
          <div class="help-row">
            <div class="help-icon">☁</div>
            <div class="help-txt"><b>Sačuvaj na server / Repozitorij</b><span>Učitanu kartu možete sačuvati na server da bude dostupna ostalim projektantima. Repozitorij prikazuje sve ranije sačuvane karte za ovaj projekat.</span></div>
          </div>
        </div>
      </div>

    </div><!-- /vlake -->

    <!-- ── DOZNAKA ─────────────────────────────── -->
    <div id="help-pane-doznaka" style="display:none;">

      <div class="help-sec">
        <div class="help-sec-hdr" onclick="toggleHelpSec(this)">
          <span class="h-arrow">▶</span>🌲 Šta je Doznaka tab?
        </div>
        <div class="help-sec-body">
          <div class="help-row">
            <div class="help-icon">🌲</div>
            <div class="help-txt">
              <b>Doznaka — timsko označavanje stabala po pojasima</b>
              <span>Alat za organizaciju doznake (odabira stabala za sječu) po odjelima. Više projektanata može raditi istovremeno — svaki hoda svojim pojasom kroz odjel dok snima GPS trag koji ostaje vidljiv ostalima. Uz to se obilježavaju posebne zone (zaštitne, sjemenjaci, prioriteti...).</span>
            </div>
          </div>
          <div class="help-diagram" style="border-color:#60a5fa;margin-top:8px;">
            <b style="color:#60a5fa;">Kako se koristi:</b><br>
            1. Otvorite <b>Doznaka</b> tab u donjem meniju<br>
            2. Kreirajte novi odjel (<b>+ Novi</b>) ili otvorite postojeći tapom na karticu<br>
            3. U detalju odjela: snimajte GPS pojaseve, ucrtavajte zone, dodajte projektante<br>
            4. Gumb <b>↺ Osvježi</b> osvježava listu odjela sa servera
          </div>
        </div>
      </div>

      <div class="help-sec">

            <b style="color:#38bdf8;">Šta je pojas doznake?</b><br>
            Projektant hoda kroz šumu u ravnim prugama (pojasima), s lijeve i desne strane odabira (doznauje) stabla za sječu. GPS trag bilježi svaki pojas — vidljivo je koji dio odjela je pokriven i koji nije. Kad svi pojasi zajedno pokriju cijeli odjel, doznaka je završena.
          </div>

            <li data-n="4.">Na kraju pojasa tapnite <b>⏹ Zaustavi GPS</b>, pređite na sljedeći pojas i ponovo pokrenite</li>

            </div>
          </div>
          <div class="help-row">
            <div class="help-icon" style="font-size:16px;">🗺</div>
            <div class="help-txt">
              <b>Pregled pokrivenosti</b>

            </div>
          </div>
          <div class="help-row">
            <div class="help-icon" style="font-size:16px;">📴</div>
            <div class="help-txt">

        </div>

    <input type="file" id="imv-file" accept=".kml,.gpx" multiple style="display:none" onchange="impVlakaFile(event)">
    <div id="imv-fname"></div>
    <div class="imv-lbl">Projekat u koji se ubacuje</div>
    <select id="imv-proj" class="imv-select" onchange="if(_impTracks.length)_impRenderTracks()"></select>
    <div id="imv-tracks"></div>
    <div id="imv-hint">Linije iz fajla postaće normalne vlake/kraci — mogu se editovati kao i snimane. Naziv T5 = vlaka, T5.1 = krak.</div>
  </div>
  <div class="imv-foot">
    <button class="imv-btn-cancel" onclick="impVlakaClose()">Odustani</button>
    <button class="imv-btn-ok" id="imv-ok" onclick="impVlakaConfirm()" disabled><svg class="ic"><use href="#ic-potvrdi"/></svg> Uvezi</button>
  </div>
</div>

<!-- Custom dialog sheet (replaces all native alert/confirm/prompt) -->
<div id="dlg-overlay" onclick="_dlgDismiss()"></div>
<div id="dlg-sheet" role="dialog" aria-modal="true">
  <div id="dlg-handle" onclick="_dlgDismiss()"></div>
  <div id="dlg-title"></div>
  <div id="dlg-msg"></div>
  <div id="dlg-input-wrap">
    <input id="dlg-input" type="text">
  </div>
  <div id="dlg-actions-list"></div>
  <div id="dlg-btns">
    <button id="dlg-cancel" class="dlg-btn-cancel" onclick="_dlgDismiss()">Odustani</button>
    <button id="dlg-ok" class="dlg-btn-ok" onclick="_dlgCommit()">OK</button>
  </div>
</div>

<!-- Fullscreen foto preglednik -->
<div id="foto-fullscreen" onclick="if(event.target===this)closeFotoFullscreen()">
  <button id="foto-fullscreen-close" onclick="closeFotoFullscreen()"><svg class="ic"><use href="#ic-zatvori"/></svg></button>
  <img id="foto-fullscreen-img" src="" alt="">
  <div id="foto-fullscreen-meta"></div>
</div>

</body>
</html>
